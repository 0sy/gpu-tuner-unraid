name: Publish Unraid image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, for example 1.3.1-unraid.1-beta.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-unraid-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/0sy/gpu-tuner-unraid
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == "0sy/gpu-tuner-unraid" ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-unraid\.[0-9]+(-beta\.[0-9]+)?$ ]]

      - name: Verify public Community Applications assets before publication
        run: python3 tests/check_unraid_assets.py --public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image
        run: |
          # Unraid's update checker only requests Docker manifest media types. BuildKit's
          # default provenance attestation turns a single-platform image into an OCI index,
          # which GHCR answers with 404 for that Accept header, so Unraid shows
          # "not available". Export a plain Docker-schema image instead.
          docker buildx build --pull --platform linux/amd64 \
            --provenance=false --sbom=false \
            --output type=docker,oci-mediatypes=false \
            -f container/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            -t "$IMAGE:$RELEASE_VERSION" -t "$IMAGE:latest" .

      - name: Run Unraid regression tests
        run: |
          docker run --rm --network none --entrypoint python \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --workdir /workspace "$IMAGE:$RELEASE_VERSION" \
            -B -m unittest discover -s tests -p 'test_unraid_*.py' -v

      - name: Run offline upstream regression tests
        run: |
          docker run --rm --network none --entrypoint bash \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --workdir /workspace "$IMAGE:$RELEASE_VERSION" \
            tests/gpu-tuner-test.sh

      - name: Check installed first-run and reset flow
        run: |
          docker run --rm --network none --tmpfs /data --entrypoint python \
            --mount type=bind,src="$PWD/tests/container_install_smoke.py",dst=/checks/install.py,readonly \
            "$IMAGE:$RELEASE_VERSION" -B /checks/install.py

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish tested image
        run: |
          docker push "$IMAGE:$RELEASE_VERSION"
          docker push "$IMAGE:latest"

      - name: Verify Unraid-compatible image manifest
        run: |
          for tag in "$RELEASE_VERSION" latest; do
            media_type=$(docker manifest inspect "$IMAGE:$tag" | python3 -c \
              'import json, sys; print(json.load(sys.stdin)["mediaType"])')
            case "$media_type" in
              application/vnd.docker.distribution.manifest.v2+json|\
              application/vnd.docker.distribution.manifest.list.v2+json)
                ;;
              *)
                echo "::error::$IMAGE:$tag has a manifest type Unraid cannot check: $media_type"
                exit 1
                ;;
            esac
          done
