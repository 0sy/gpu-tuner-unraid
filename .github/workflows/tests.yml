name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install nvidia-ml-py

      - name: Check Python syntax
        run: |
          python -m compileall -q gpu_tuner container

      - name: Run Unraid packaging tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_unraid_*.py' \
            -v

      - name: Build Docker image
        run: |
          docker build \
            -f container/Dockerfile \
            -t gpu-tuner-unraid:ci \
            .
